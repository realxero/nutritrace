# Fork: unit tests + end-to-end/monkey tests on every push.
# The e2e job builds the app, boots the real server against a mock AI
# (e2e/mock-ai.mjs) and drives it on an iPhone-sized screen in WebKit
# (Safari's engine) and Chromium. Failure screenshots + traces are uploaded.
name: Fork tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      monkey_seed:
        description: Random seed for the monkey test
        default: '1234'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Build the app
        run: |
          npm ci
          npm run build
      - name: Server dependencies
        run: cd server && npm ci
      - name: Test dependencies + browser
        run: |
          cd e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run e2e + monkey tests
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          MONKEY_SEED: ${{ github.event.inputs.monkey_seed || github.run_number }}
        run: cd e2e && mkdir -p .auth && npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
