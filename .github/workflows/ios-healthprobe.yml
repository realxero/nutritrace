name: HealthProbe IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-healthprobe/**'
      - '.github/workflows/ios-healthprobe.yml'

permissions:
  contents: write   # to publish the IPA as a release

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-healthprobe
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project HealthProbe.xcodeproj -target HealthProbe \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Embed HealthKit entitlement + package IPA
        run: |
          APP=build/Release-iphoneos/HealthProbe.app
          # Ad-hoc signature that carries the entitlements, so SideStore
          # knows the app wants HealthKit when it re-signs it.
          codesign --force --sign - --entitlements HealthProbe.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry HealthProbe.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HealthProbe-ipa
          path: ios-healthprobe/HealthProbe.ipa

      - name: Publish as release "healthprobe"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete healthprobe --yes --cleanup-tag || true
          gh release create healthprobe HealthProbe.ipa --prerelease \
            --title "HealthProbe test build" \
            --notes "Unsigned IPA for SideStore / LiveContainer. Built from ${GITHUB_SHA::7}."
